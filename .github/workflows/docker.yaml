name: waivatar docker images

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - data/**
      - Dockerfile.*
      - requirements.txt
      - VERSION
      - .github/workflows/docker.yaml
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the triggering commit.
        type: string
        default: ""
      data_only:
        description: Build and publish only the data image.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          data='{"image":"waivatar-data","dockerfile":"Dockerfile.data"}'
          mcp='{"image":"waivatar-mcp","dockerfile":"Dockerfile.mcp"}'
          if [ "${{ inputs.data_only }}" = "true" ]; then
            echo "matrix={\"include\":[$data]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$mcp,$data]}" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Read snapshot date
        id: snapshot
        run: echo "date=$(jq -r .generated_at data/SNAPSHOT | cut -c1-10)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=snapshot-${{ steps.snapshot.outputs.date }},enable=${{ matrix.image == 'waivatar-data' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
